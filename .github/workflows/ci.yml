name: CI — Sendwe SOS (Frontend)

on:
  push:
    branches: [main, develop]
    paths:
      - 'Sendwe SOS frontend/**'
  pull_request:
    paths:
      - 'Sendwe SOS frontend/**'

defaults:
  run:
    working-directory: Sendwe SOS frontend

jobs:
  build:
    name: Build + Lint (Vite/React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Sendwe SOS frontend/package-lock.json'

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build de production
        run: npm run build
